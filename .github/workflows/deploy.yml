name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------
  # Run tests on every push and pull request
  # -------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm test

  # -------------------------------------------------------------------
  # Publish public/ (with a freshly rebuilt API snapshot) to the
  # ovh-deploy branch — OVH's git integration tracks that branch as the
  # doc root. Keeps CMS commits (raw markdown to main) flowing straight
  # through to a live redeploy.
  # -------------------------------------------------------------------
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # One publish to ovh-deploy at a time; back-to-back CMS commits otherwise race on the ref.
    concurrency:
      group: ovh-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Publish ovh-deploy branch
        run: |
          git config user.email "deploy@github-actions"
          git config user.name "GitHub Actions"
          bash scripts/deploy-branch.sh
