name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -------------------------------------------------------------------
  # Run tests on every push and pull request
  # -------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm test

  # -------------------------------------------------------------------
  # Publish public/ (with a freshly rebuilt API snapshot) to the
  # ovh-deploy branch — OVH's git integration tracks that branch as the
  # doc root. Keeps CMS commits (raw markdown to main) flowing straight
  # through to a live redeploy.
  # -------------------------------------------------------------------
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Publish ovh-deploy branch
        run: |
          git config user.email "deploy@github-actions"
          git config user.name "GitHub Actions"
          bash scripts/deploy-branch.sh
